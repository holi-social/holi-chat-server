version: "3"

services:

  chat-server:
    image: matrixdotorg/synapse:latest
    container_name: chat-server
    env_file:
      - ./.envrc.local
    restart: always
    volumes:
      - ./data:/data
    ports:
      - 8008:8008
      - 8448:8448
    networks:
      - chat-net
    logging:
      driver: "local"
    depends_on:
      - chat-db
      - chat-push-gateway

  chat-push-gateway:
    image: matrixdotorg/sygnal
    container_name: chat-push-gateway
    restart: always
    env_file:
      - ./.envrc-push-gateway.local
    volumes:
      - ./data-push-gateway:/data
    ports:
      - 8050:5000
    networks:
      - chat-net
    logging:
      driver: "local"

  chat-db:
    image: postgres
    container_name: chat-db
    restart: always
    volumes:
      - chat-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${HOLI_CHAT_DB_USER}
      - POSTGRES_PASSWORD=${HOLI_CHAT_DB_PASSWORD}
      - POSTGRES_DB=${HOLI_CHAT_DB_NAME}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - 5433:5432
    networks:
      - chat-net

volumes:
  chat-db:

networks:
  chat-net:
    driver: bridge
